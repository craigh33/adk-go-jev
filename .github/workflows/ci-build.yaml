name: CI Build

on:
  pull_request:

permissions:
  contents: read

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Check generated API types
        run: make check-generated

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2
          args: --timeout=5m

      - name: Unit tests
        run: go test -race ./... -count=1

      - name: Compile opt-in live tests
        run: go test -tags=integration ./typesafe -run '^$'

      - name: Bedrock example tests
        working-directory: examples/bedrock-routing
        run: go test ./...

      - name: Bedrock example lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2
          working-directory: examples/bedrock-routing
          args: --config ../../.golangci.yaml --timeout=5m
